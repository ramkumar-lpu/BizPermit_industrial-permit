services:
  mongo:
    image: mongo:7.0
    container_name: bizpermit-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bizpermit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizpermit-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-fallback-key-2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://127.0.0.1:80,http://localhost}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/bizpermit_db}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-bizpermit_db}
      - USE_MOCK_DB_IF_UNAVAILABLE=${USE_MOCK_DB_IF_UNAVAILABLE:-False}
      - AUTO_SEED_DEMO_DATA=${AUTO_SEED_DEMO_DATA:-True}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bizpermit-default-jwt-secret-phase1-2026}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES:-15}
      - JWT_REFRESH_EXPIRY_DAYS=${JWT_REFRESH_EXPIRY_DAYS:-7}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@bizpermit.local}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - SUPABASE_BUCKET_NAME=${SUPABASE_BUCKET_NAME:-bizpermit}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - bizpermit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bizpermit-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_PROXY_URL=http://backend:8000
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bizpermit-network

volumes:
  mongodb_data:
    name: bizpermit_mongodb_data

networks:
  bizpermit-network:
    name: bizpermit-network
    driver: bridge
